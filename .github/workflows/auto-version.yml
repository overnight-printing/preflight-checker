name: Auto Version

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: auto-version-main
  cancel-in-progress: false

jobs:
  bump-patch-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Confirm main still points to the verified commit
        id: current
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Increase patch version
        if: steps.current.outputs.verified == 'true'
        run: npm version patch --no-git-tag-version
      - name: Commit updated version
        if: steps.current.outputs.verified == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore: bump version to v${VERSION}"
          git push origin HEAD:main
